apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: 
  namespace: 
spec:
  serviceName: my-svc
  replicas: 1
  selector:
    matchLabels:
      app: my-app
  template:
    metadata:
      labels:
        app: my-app
    spec:
      containers:
        - name: my-app
          image: nginx:latest
