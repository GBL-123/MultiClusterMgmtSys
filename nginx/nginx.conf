# 生产环境 nginx 配置：HTTPS 终止 + 反向代理到应用容器（Blazor Server 需要 WebSocket 升级）
# 证书文件放 ./nginx/certs/ 下：fullchain.pem + privkey.pem（挂载到 /etc/nginx/certs）
# 部署前：mkdir -p nginx/certs && 放入证书；没有证书可用 openssl 生成自签名（见 compose 注释）

events {}

http {
    # kubeconfig/上传内容可能较大
    client_max_body_size 10m;

    # HTTP 一律强制跳转 HTTPS
    server {
        listen 80;
        listen [::]:80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        # 换成你的域名，如 server_name mcms.example.com;
        server_name _;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        location / {
            proxy_pass http://multiclustermgmtsys:8080;
            proxy_http_version 1.1;
            # Blazor Server (SignalR) 需要 Upgrade/Connection 头支持 WebSocket
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # SignalR 长连接，超时给足
            proxy_read_timeout  3600s;
            proxy_send_timeout  3600s;
        }
    }
}