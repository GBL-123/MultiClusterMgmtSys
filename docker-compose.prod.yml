# 生产部署：docker compose -f docker-compose.prod.yml up -d
#
# 注意：不要用裸 `docker compose up` 部署 —— 它会合并 VS 调试用的
# docker-compose.override.yml（Development 环境 + 用户密钥挂载，在服务器上会失败）。
#
# 数据持久化：SQLite 库重定向到 /app/db（绑定挂载宿主机 ./db 目录），
# 数据库文件直接出现在部署目录的 db/ 下，可直接复制备份。
#
# 服务日志：Serilog 按天滚动写入 /app/logs（绑定挂载宿主机 ./logs 目录），
# 容器重建/删除都不丢日志，按天滚动并保留 30 天，可直接 tail/grep 排查。
#
# 反向代理：nginx 容器终止 TLS 并反代应用（Blazor Server 需 WebSocket 升级），
# 对外只暴露 80/443，应用 8080 不再映射宿主端口，只能经内部网络访问。
# 证书放 ./nginx/certs/：fullchain.pem + privkey.pem（nginx 以 root 启动，目录无需 chown）。
# 没有正式证书时可先生成自签名测试（必须带 SAN：IP/域名要与访问地址一致）：
#   cd nginx/certs && openssl req -x509 -newkey rsa:2048 -nodes -days 3650 \
#     -keyout privkey.pem -out fullchain.pem \
#     -subj "/CN=192.168.1.100" -addext "subjectAltName=IP:192.168.1.100,DNS:mcms.local"
# （把 192.168.1.100 换成你的服务器 IP；自签名浏览器会有"不安全"警告，属正常）
#
# 挂载目录（./db ./logs ./nginx/certs）由 fs-init 容器在部署时自动创建并修正属主，
# 不再需要手工 mkdir/chown：fs-init 用应用镜像以 root 一次性执行（幂等），完成后即退出；
# 目录属主默认 1654（.NET 镜像内置 app 用户的 UID），服务器上可用环境变量覆盖：
#   MCMS_APP_UID=1000 docker compose -f docker-compose.prod.yml up -d
# （也可用 `sudo chown -R $(id -u):$(id -g) db logs` 配合自定义 UID，效果等价）
#
# 升级：docker compose -f docker-compose.prod.yml up -d（数据保留在 ./db，日志保留在 ./logs）

name: multiclustermgmtsys

services:
  # 一次性目录初始化：创建 ./db ./logs ./nginx/certs（若缺失）并把 db/logs 属主
  # 修正为运行应用的用户。幂等，每次 up 都会跑一遍，跑完即退出。
  # 复用应用镜像（Debian 系含 /bin/sh），不额外拉取镜像。
  fs-init:
    image: multiclustermgmtsys:v1.0.0
    container_name: mcms-fs-init
    user: "0"
    restart: "no"
    entrypoint:
      - /bin/sh
      - -c
      - mkdir -p /data/db /data/logs /data/certs
        && chown -R ${MCMS_APP_UID:-1654}:${MCMS_APP_UID:-1654} /data/db /data/logs
    volumes:
      # 与应用/nginx 挂载同一批宿主机目录；bind 目录若缺失由 Docker 以 root 自动创建，
      # fs-init 再 chown 成应用可写
      - ./db:/data/db
      - ./logs:/data/logs
      - ./nginx/certs:/data/certs

  multiclustermgmtsys:
    image: multiclustermgmtsys:v1.0.0
    container_name: multiclustermgmtsys
    restart: unless-stopped
    depends_on:
      fs-init:
        condition: service_completed_successfully
    # 应用不再对外暴露端口，仅经 compose 内部网络被 nginx 访问
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "8080"
      # 应用默认连接串是相对路径(容器内 /app)，这里重定向到挂载的 db 目录
      ConnectionStrings__DefaultConnection: "Data Source=/app/db/MultiClusterMgmtSys.db"
      # Serilog 日志写到挂载目录（app-日期.log，滚动保留 30 天）
      Logging__File__Path: "/app/logs/app-.log"
      TZ: Asia/Shanghai
    volumes:
      # SQLite 数据库目录（宿主机 ./db <-> 容器 /app/db），含 .db/.db-shm/.db-wal
      - ./db:/app/db
      # 服务日志目录（宿主机 ./logs <-> 容器 /app/logs），按天滚动
      - ./logs:/app/logs

  nginx:
    image: nginx:stable-alpine
    container_name: mcms-nginx
    restart: unless-stopped
    depends_on:
      - multiclustermgmtsys
    ports:
      # 对外只暴露 80/443，HTTP 由 nginx 强制 301 跳转 HTTPS
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro

# 使用绑定挂载后不再需要命名卷；备份 = 直接停服复制 ./db/MultiClusterMgmtSys.db
